name: Bug report
description: Something is broken or behaves unexpectedly.
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected instead
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: The exact command, please.
      render: shell
      placeholder: python -m loghawk scan ./logs --year 2026 --verbose
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: LogHawk version
      placeholder: "1.0.0  (python -m loghawk --version)"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [Windows, macOS, Linux, Other]
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: "3.12.4"
    validations:
      required: true
  - type: textarea
    id: traceback
    attributes:
      label: Full traceback, if there was one
      render: shell

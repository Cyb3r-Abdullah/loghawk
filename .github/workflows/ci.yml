name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx

      - name: Run the test suite
        run: python run_tests.py -v

      - name: Detection smoke test against the sample intrusion
        run: python -m loghawk scan samples --year 2026 --no-color

      - name: Fail the build on critical findings
        run: |
          python -m loghawk scan samples --year 2026 --format json \
            --fail-on critical --output findings.json || echo "critical findings present (expected for the demo data)"

      - name: Upload findings
        uses: actions/upload-artifact@v7
        with:
          name: loghawk-findings-${{ matrix.python-version }}
          path: findings.json
